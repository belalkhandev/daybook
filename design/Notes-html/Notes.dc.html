<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daybook — Notes</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#4338CA}a:hover{color:#312E81}
input::placeholder{color:#6B6B7B}
</style>
</helmet>
<div style="position: relative; min-height: 100vh; overflow: hidden; background: #FFFFFF; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; color: #16161D; -webkit-font-smoothing: antialiased">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; z-index: 0">
<div style="position: absolute; top: -200px; right: -140px; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(closest-side, rgba(167,139,250,0.28), rgba(167,139,250,0))"></div>
<div style="position: absolute; top: -120px; left: -160px; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(closest-side, rgba(147,197,253,0.26), rgba(147,197,253,0))"></div>
<div style="position: absolute; top: 44%; left: 10%; width: 1000px; height: 280px; border-radius: 50%; transform: rotate(10deg); background: linear-gradient(90deg, rgba(253,186,116,0), rgba(253,186,116,0.22), rgba(244,114,182,0.16), rgba(244,114,182,0)); filter: blur(32px)"></div>
<div style="position: absolute; bottom: -220px; right: 12%; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(closest-side, rgba(110,231,183,0.20), rgba(110,231,183,0))"></div>
</div>
<div style="position: relative; z-index: 1; max-width: 1360px; margin: 0 auto; padding: 20px 32px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding: 10px 12px 10px 16px; border-radius: 20px; background: rgba(255,255,255,{{glass}}); backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%); border: 1px solid rgba(255,255,255,0.9)">
<div style="display: flex; align-items: center; gap: 10px">
<div aria-hidden="true" style="width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, {{accent}}, #A78BFA 55%, #FDBA74); box-shadow: inset 0 1px 0 rgba(255,255,255,0.5)"></div>
<span style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em">Daybook</span>
</div>
<nav aria-label="Views" style="display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 14px; background: rgba(22,22,29,0.045)">
<a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 36px; padding: 0 16px; border-radius: 10px; color: #4A4A58; font-size: 14px; font-weight: 500; text-decoration: none">Today</a>
<button type="button" style="display: inline-flex; align-items: center; min-height: 36px; padding: 0 16px; border-radius: 10px; border: none; background: transparent; color: #4A4A58; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Upcoming</button>
<a href="Notes.dc.html" aria-current="page" style="display: inline-flex; align-items: center; min-height: 36px; padding: 0 16px; border-radius: 10px; background: #FFFFFF; color: #16161D; font-size: 14px; font-weight: 600; text-decoration: none; box-shadow: 0 1px 2px rgba(22,22,29,0.08), 0 4px 12px rgba(22,22,29,0.05)">Notes</a>
<button type="button" style="display: inline-flex; align-items: center; min-height: 36px; padding: 0 16px; border-radius: 10px; border: none; background: transparent; color: #4A4A58; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Calendar</button>
</nav>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" style="display: inline-flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 8px 0 12px; border-radius: 11px; border: 1px solid rgba(22,22,29,0.08); background: rgba(255,255,255,0.7); color: #4A4A58; font-family: inherit; font-size: 13px; cursor: pointer">
<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
Search
<kbd style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; padding: 2px 6px; border-radius: 6px; background: rgba(22,22,29,0.06); color: #4A4A58">Ctrl K</kbd>
</button>
<a href="QuickAdd.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 11px; background: {{accent}}; color: #FFFFFF; font-size: 13px; font-weight: 600; text-decoration: none; box-shadow: 0 6px 16px rgba(79,70,229,0.25)">
<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M12 5v14M5 12h14"></path></svg>
New
</a>
<div aria-hidden="true" style="width: 1px; height: 22px; margin: 0 4px; background: rgba(22,22,29,0.1)"></div>
<button type="button" aria-label="Minimize window" style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; padding: 0; border: none; border-radius: 50%; background: rgba(22,22,29,0.06); color: #3A3A48; cursor: pointer"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M7 12h10"></path></svg></button>
<button type="button" aria-label="Maximize window" style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; padding: 0; border: none; border-radius: 50%; background: rgba(22,22,29,0.06); color: #3A3A48; cursor: pointer"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2"><rect x="7" y="7" width="10" height="10" rx="1.5"></rect></svg></button>
<button type="button" aria-label="Close window" style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; padding: 0; border: none; border-radius: 50%; background: rgba(22,22,29,0.06); color: #3A3A48; cursor: pointer"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M8 8l8 8M16 8l-8 8"></path></svg></button>
</div>
</header>

<section style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #5A5A6B">{{noteCount}} notes · 3 pinned</span>
<h1 style="margin: 0; font-size: 46px; line-height: 1.05; font-weight: 600; letter-spacing: -0.035em">Notes</h1>
</div>
<div style="position: relative; display: flex; align-items: center; gap: 10px; flex: 0 1 380px; min-width: 240px; padding: 0 14px; border-radius: 14px; background: rgba(255,255,255,{{glass}}); backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%); border: 1px solid rgba(255,255,255,0.9)">
<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="flex: none; color: #5A5A6B; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<label for="note-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Search notes</label>
<input id="note-search" type="search" placeholder="Search notes" style="flex: 1 1 auto; min-width: 0; min-height: 46px; border: none; outline: none; background: transparent; font-family: inherit; font-size: 14px; color: #16161D">
</div>
</section>

<div role="group" aria-label="Filter notes" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
<button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); {{f.style}}">{{f.label}}<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; opacity: 0.8">{{f.count}}</span></button>
</sc-for>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px">
<div style="flex: 999 1 520px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; align-items: start">
<a href="QuickAdd.dc.html" style="align-self: stretch; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 150px; border-radius: 20px; border: 1.5px dashed rgba(22,22,29,0.18); color: #3A3A48; font-size: 14px; font-weight: 500; text-decoration: none; background: rgba(255,255,255,0.35)">
<span aria-hidden="true" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: {{accent}}; color: #FFFFFF"><svg viewBox="0 0 24 24" width="20" height="20" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M12 5v14M5 12h14"></path></svg></span>
New note
</a>
<sc-for list="{{visible}}" as="n" hint-placeholder-count="6">
<button type="button" aria-pressed="{{n.pressed}}" onClick="{{n.pick}}" style="display: flex; flex-direction: column; align-items: stretch; gap: 10px; padding: 18px; border-radius: 20px; text-align: left; font-family: inherit; color: #16161D; cursor: pointer; background: rgba(255,255,255,{{glass}}); backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%); {{n.ring}}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: #4A4A58"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{n.color}}"></span>{{n.tag}}</span>
<sc-if value="{{n.pinned}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="15" height="15" role="img" aria-label="Pinned" style="color: #5A5A6B; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M9 4h6l-1 6 3 3H7l3-3-1-6zM12 13v7"></path></svg></sc-if>
</div>
<span style="font-size: 16px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em">{{n.title}}</span>
<span style="font-size: 13px; line-height: 1.5; color: #5A5A6B; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden">{{n.excerpt}}</span>
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #6B6B7B">{{n.updated}}</span>
</button>
</sc-for>
</div>

<article aria-labelledby="editor-title" style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 18px; padding: 24px 28px 28px; border-radius: 24px; background: rgba(255,255,255,{{glassStrong}}); backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%); border: 1px solid rgba(255,255,255,0.95)">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px">
<div role="toolbar" aria-label="Formatting" style="display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: rgba(22,22,29,0.045)">
<button type="button" aria-label="Bold" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; padding: 0; border: none; border-radius: 9px; background: transparent; color: #3A3A48; cursor: pointer"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><path d="M7 5h6a3.5 3.5 0 0 1 0 7H7zM7 12h7a3.5 3.5 0 0 1 0 7H7z"></path></svg></button>
<button type="button" aria-label="Italic" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; padding: 0; border: none; border-radius: 9px; background: transparent; color: #3A3A48; cursor: pointer"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M10 5h8M6 19h8M14 5l-4 14"></path></svg></button>
<button type="button" aria-label="Checklist" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; padding: 0; border: none; border-radius: 9px; background: transparent; color: #3A3A48; cursor: pointer"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M4 7l2 2 3-3M4 16l2 2 3-3M13 8h7M13 17h7"></path></svg></button>
<button type="button" aria-label="Bulleted list" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; padding: 0; border: none; border-radius: 9px; background: transparent; color: #3A3A48; cursor: pointer"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"></path></svg></button>
<button type="button" aria-label="Insert link" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; padding: 0; border: none; border-radius: 9px; background: transparent; color: #3A3A48; cursor: pointer"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg></button>
</div>
<div style="display: flex; align-items: center; gap: 6px">
<button type="button" style="display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border: none; border-radius: 10px; background: rgba(79,70,229,0.10); color: #4338CA; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path><path d="M18.5 14.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"></path></svg>Format with AI</button>
<span style="display: inline-flex; align-items: center; gap: 6px; margin-right: 6px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #5A5A6B"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: #10B981"></span>Saved</span>
<button type="button" aria-label="Pin note" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; padding: 0; border: 1px solid rgba(22,22,29,0.08); border-radius: 10px; background: rgba(255,255,255,0.7); color: #3A3A48; cursor: pointer"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M9 4h6l-1 6 3 3H7l3-3-1-6zM12 13v7"></path></svg></button>
<button type="button" aria-label="Delete note" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; padding: 0; border: 1px solid rgba(22,22,29,0.08); border-radius: 10px; background: rgba(255,255,255,0.7); color: #3A3A48; cursor: pointer"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M5 7h14M10 11v6M14 11v6M7 7l1 12h8l1-12M9 7V4h6v3"></path></svg></button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 12px; color: #4A4A58">
<span style="display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 999px; background: rgba(22,22,29,0.05); font-weight: 500"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{sel.color}}"></span>{{sel.tag}}</span>
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #5A5A6B">{{sel.updated}}</span>
</div>
<h2 id="editor-title" style="margin: 0; font-size: 30px; line-height: 1.15; font-weight: 600; letter-spacing: -0.025em">{{sel.title}}</h2>
</div>
<div aria-hidden="true" style="height: 1px; background: rgba(22,22,29,0.08)"></div>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{sel.blocks}}" as="b" hint-placeholder-count="4">
<sc-if value="{{b.isText}}" hint-placeholder-val="{{true}}">
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #2A2A35">{{b.text}}</p>
</sc-if>
<sc-if value="{{b.isCheck}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: flex-start; gap: 12px">
<button type="button" aria-label="{{b.label}}" onClick="{{b.toggle}}" style="flex: none; width: 22px; height: 22px; margin-top: 1px; display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 7px; border: 1.5px solid; cursor: pointer; {{b.boxStyle}}">
<sc-if value="{{b.done}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="fill: none; stroke: #FFFFFF; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
</button>
<span style="font-size: 15px; line-height: 1.5; {{b.textStyle}}">{{b.text}}</span>
</div>
</sc-if>
</sc-for>
</div>
<sc-if value="{{sel.hasChecks}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 6px; padding: 14px 16px; border-radius: 16px; background: rgba(22,22,29,0.035); border: 1px solid rgba(22,22,29,0.06)">
<span style="font-size: 13px; color: #4A4A58">Send the open items in this note to Today</span>
<a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 11px; background: #16161D; color: #FFFFFF; font-size: 13px; font-weight: 600; text-decoration: none">Add to today<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
</sc-if>
</article>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4F46E5","options":["#4F46E5","#0F766E","#C2410C","#16161D"]},"glass":{"editor":"range","default":0.55,"min":0.3,"max":0.9,"step":0.05},"$preview":{"width":1440,"height":1060}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const accent = this.props.accent ?? '#4F46E5';
    const glass = this.props.glass ?? 0.55;
    const filter = st.filter || 'all';
    const selId = st.selId || 'n1';
    const checks = st.checks || { 'n1:1': true, 'n2:0': true, 'n5:0': true };
    const notes = [
      { id: 'n1', title: 'Sprint ideas', tag: 'Ideas', color: '#A78BFA', pinned: true, updated: 'Edited 2h ago', blocks: [
        { t: 'p', text: 'Things worth trying before v1:' },
        { t: 'c', text: 'Offline-first sync with a local SQLite store' },
        { t: 'c', text: 'Keyboard-only mode — every action reachable from Ctrl K' },
        { t: 'c', text: 'Recurring tasks written in plain language, like “every Friday 5pm”' },
        { t: 'p', text: 'Keep the glass look, but add a reduced-transparency switch in Settings.' }
      ] },
      { id: 'n2', title: 'Groceries', tag: 'Personal', color: '#34D399', pinned: true, updated: 'Edited yesterday', blocks: [
        { t: 'c', text: 'Rice, 5 kg' },
        { t: 'c', text: 'Red lentils' },
        { t: 'c', text: 'Eggs, 12' },
        { t: 'c', text: 'Green chillies' },
        { t: 'c', text: 'Mustard oil' },
        { t: 'c', text: 'Tea' }
      ] },
      { id: 'n3', title: 'Design sync — notes', tag: 'Work', color: '#FDBA74', pinned: true, updated: 'Edited Mon', blocks: [
        { t: 'p', text: 'Keep the glass cards; lower the blur on older GPUs.' },
        { t: 'p', text: 'Ship the light theme first, dark theme in v0.5.' },
        { t: 'p', text: 'The week strip should scroll back to past weeks.' }
      ] },
      { id: 'n4', title: 'Release checklist v0.4', tag: 'Work', color: '#93C5FD', pinned: false, updated: 'Oct 20', blocks: [
        { t: 'c', text: 'Bump version in Cargo.toml' },
        { t: 'c', text: 'Build .deb and .rpm packages' },
        { t: 'c', text: 'Publish the Flatpak' },
        { t: 'c', text: 'Update the changelog' }
      ] },
      { id: 'n5', title: 'Reading list', tag: 'Personal', color: '#F9A8D4', pinned: false, updated: 'Oct 22', blocks: [
        { t: 'p', text: 'Pages 41, 88 and 132 — the parts about attention and deep work. Revisit before the weekend.' }
      ] },
      { id: 'n6', title: 'Weekend', tag: 'Personal', color: '#FCD34D', pinned: false, updated: 'Oct 18', blocks: [
        { t: 'p', text: 'Visit Nani on Saturday, fix the balcony light, back up the phone photos.' }
      ] }
    ];
    const dressed = notes.map((n) => {
      const blocks = n.blocks.map((b, i) => {
        const key = n.id + ':' + i;
        const d = !!checks[key];
        return {
          text: b.text,
          isText: b.t === 'p',
          isCheck: b.t === 'c',
          done: d,
          label: (d ? 'Uncheck: ' : 'Check: ') + b.text,
          toggle: () => this.setState({ checks: { ...checks, [key]: !d } }),
          boxStyle: d ? 'background: ' + accent + '; border-color: ' + accent : 'background: rgba(255,255,255,0.9); border-color: rgba(22,22,29,0.24)',
          textStyle: d ? 'color: #6B6B7B; text-decoration: line-through' : 'color: #2A2A35; text-decoration: none'
        };
      });
      const on = n.id === selId;
      return {
        ...n,
        blocks,
        hasChecks: blocks.some((b) => b.isCheck && !b.done),
        excerpt: n.blocks.map((b) => b.text).join(' · '),
        pressed: on ? 'true' : 'false',
        ring: on ? 'border: 1.5px solid ' + accent + '; transform: translateY(-2px)' : 'border: 1.5px solid rgba(255,255,255,0.9)',
        pick: () => this.setState({ selId: n.id })
      };
    });
    const match = (n, key) => key === 'all' || (key === 'pinned' ? n.pinned : n.tag.toLowerCase() === key);
    const visible = dressed.filter((n) => match(n, filter));
    const sel = dressed.find((n) => n.id === selId) || dressed[0];
    const chip = (on) => on
      ? 'background: #16161D; color: #FFFFFF; border-color: #16161D'
      : 'background: rgba(255,255,255,0.6); color: #3A3A48; border-color: rgba(22,22,29,0.1)';
    return {
      accent,
      glass,
      glassStrong: Math.min(0.95, glass + 0.2).toFixed(2),
      noteCount: notes.length,
      visible,
      sel,
      filters: [
        { key: 'all', label: 'All' },
        { key: 'pinned', label: 'Pinned' },
        { key: 'work', label: 'Work' },
        { key: 'personal', label: 'Personal' },
        { key: 'ideas', label: 'Ideas' }
      ].map((f) => ({
        ...f,
        count: dressed.filter((n) => match(n, f.key)).length,
        style: chip(filter === f.key),
        pressed: filter === f.key ? 'true' : 'false',
        pick: () => this.setState({ filter: f.key })
      }))
    };
  }
}
</script>
</body>
