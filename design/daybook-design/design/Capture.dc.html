<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daybook — Screenshot capture</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1A0B16}
a{color:#4338CA}a:hover{color:#312E81}
</style>
</helmet>
<div style="position: relative; min-height: 100vh; overflow: hidden; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; color: #16161D; -webkit-font-smoothing: antialiased; background: radial-gradient(120% 90% at 85% 100%, #E95420 0%, #A1305A 30%, #4E1240 60%, #2C001E 100%)">

<div aria-hidden="true" style="position: absolute; inset: 0">
<div style="position: absolute; top: 0; left: 0; right: 0; height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #0B0B0E; color: #F1F1F4; font-size: 13px; font-weight: 500">
<span>Activities</span>
<span>Thu 29 Oct  14:02</span>
<span style="display: inline-flex; gap: 12px; align-items: center"><span style="width: 14px; height: 10px; border: 1.5px solid #F1F1F4; border-radius: 2px"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #F1F1F4"></span></span>
</div>
<div style="position: absolute; top: 30px; left: 0; bottom: 0; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 16px; background: rgba(10,10,14,0.55)">
<span style="width: 40px; height: 40px; border-radius: 10px; background: #2A2A38"></span>
<span style="width: 40px; height: 40px; border-radius: 10px; background: #E95420"></span>
<span style="width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, #4F46E5, #A78BFA 55%, #FDBA74)"></span>
<span style="width: 40px; height: 40px; border-radius: 10px; background: #0F1115"></span>
<span style="width: 40px; height: 40px; border-radius: 10px; background: #3B82F6"></span>
</div>
<div style="position: absolute; left: 44%; top: 26%; width: 50%; aspect-ratio: 16 / 10; border-radius: 10px; box-shadow: 0 24px 60px rgba(0,0,0,0.45); overflow: hidden"><svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block; width: 100%; height: 100%"><sc-for list="{{webImg.rects}}" as="q" hint-placeholder-count="3"><rect x="{{q.x}}" y="{{q.y}}" width="{{q.w}}" height="{{q.h}}" rx="{{q.rx}}" style="fill: {{q.f}}; opacity: {{q.o}}; stroke: {{q.s}}; stroke-width: {{q.sw}}"></rect></sc-for><sc-for list="{{webImg.circles}}" as="q" hint-placeholder-count="3"><circle cx="{{q.x}}" cy="{{q.y}}" r="{{q.r}}" style="fill: {{q.f}}"></circle></sc-for></svg></div>
<div style="position: absolute; left: 8%; top: 10%; width: 54%; aspect-ratio: 16 / 10; border-radius: 10px; box-shadow: 0 24px 60px rgba(0,0,0,0.5); overflow: hidden"><svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block; width: 100%; height: 100%"><sc-for list="{{codeImg.rects}}" as="q" hint-placeholder-count="3"><rect x="{{q.x}}" y="{{q.y}}" width="{{q.w}}" height="{{q.h}}" rx="{{q.rx}}" style="fill: {{q.f}}; opacity: {{q.o}}; stroke: {{q.s}}; stroke-width: {{q.sw}}"></rect></sc-for><sc-for list="{{codeImg.circles}}" as="q" hint-placeholder-count="3"><circle cx="{{q.x}}" cy="{{q.y}}" r="{{q.r}}" style="fill: {{q.f}}"></circle></sc-for></svg></div>
</div>

<sc-if value="{{selecting}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; border-radius: 6px; outline: 2px solid #FFFFFF; box-shadow: 0 0 0 4000px rgba(8,8,16,0.52); {{boxStyle}}">
<div style="position: absolute; top: -40px; left: 0; display: flex; gap: 6px; white-space: nowrap">
<span style="display: inline-flex; align-items: center; min-height: 28px; padding: 0 10px; border-radius: 8px; background: #16161D; color: #FFFFFF; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px">{{sizeLabel}}</span>
<sc-if value="{{isWindow}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font-size: 12px; font-weight: 500">Snapped to window · Code — store.rs</span></sc-if>
</div>
<sc-if value="{{isArea}}" hint-placeholder-val="{{true}}">
<span aria-hidden="true" style="position: absolute; top: -6px; left: -6px; width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF; border: 2px solid {{accent}}"></span>
<span aria-hidden="true" style="position: absolute; top: -6px; right: -6px; width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF; border: 2px solid {{accent}}"></span>
<span aria-hidden="true" style="position: absolute; bottom: -6px; left: -6px; width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF; border: 2px solid {{accent}}"></span>
<span aria-hidden="true" style="position: absolute; bottom: -6px; right: -6px; width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF; border: 2px solid {{accent}}"></span>
<span aria-hidden="true" style="position: absolute; left: 33.33%; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.35)"></span>
<span aria-hidden="true" style="position: absolute; left: 66.66%; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.35)"></span>
<span aria-hidden="true" style="position: absolute; top: 33.33%; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.35)"></span>
<span aria-hidden="true" style="position: absolute; top: 66.66%; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.35)"></span>
</sc-if>
</div>

<div role="toolbar" aria-label="Screenshot" style="position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; width: max-content; max-width: calc(100% - 40px); padding: 8px; border-radius: 20px; background: rgba(255,255,255,0.82); backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%); border: 1px solid rgba(255,255,255,0.95)">
<div role="group" aria-label="Capture mode" style="display: flex; gap: 2px; padding: 3px; border-radius: 13px; background: rgba(22,22,29,0.06)">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
<button type="button" aria-pressed="{{m.pressed}}" onClick="{{m.pick}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border: none; border-radius: 10px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; {{m.style}}">
<sc-if value="{{m.isArea}}" hint-placeholder-val="{{true}}"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path></svg></sc-if>
<sc-if value="{{m.isWindow}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linejoin: round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 9h18"></path></svg></sc-if>
<sc-if value="{{m.isScreen}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg></sc-if>
{{m.label}}
</button>
</sc-for>
</div>
<div aria-hidden="true" style="width: 1px; height: 26px; background: rgba(22,22,29,0.12)"></div>
<button type="button" onClick="{{cycleDelay}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border-radius: 11px; border: 1px solid rgba(22,22,29,0.1); background: rgba(255,255,255,0.8); color: #3A3A48; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9 2h6"></path></svg>{{delayLabel}}</button>
<sc-for list="{{options}}" as="o" hint-placeholder-count="2">
<button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.toggle}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border-radius: 11px; border: 1px solid; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; {{o.style}}"><span aria-hidden="true" style="width: 16px; height: 16px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 5px; {{o.box}}"><sc-if value="{{o.on}}" hint-placeholder-val="{{true}}"><svg viewBox="0 0 24 24" width="11" height="11" style="fill: none; stroke: #FFFFFF; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></span>{{o.label}}</button>
</sc-for>
<div aria-hidden="true" style="width: 1px; height: 26px; background: rgba(22,22,29,0.12)"></div>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border: none; border-radius: 11px; background: transparent; color: #3A3A48; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer">Cancel<kbd style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; padding: 1px 6px; border-radius: 5px; background: rgba(22,22,29,0.07); color: #3A3A48">Esc</kbd></button>
<button type="button" onClick="{{capture}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border: none; border-radius: 13px; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linejoin: round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Capture<kbd style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,0.18); color: #FFFFFF">↵</kbd></button>
</div>
</sc-if>

<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<div role="status" style="position: absolute; right: 28px; bottom: 28px; width: 380px; max-width: calc(100% - 56px); display: flex; flex-direction: column; gap: 14px; padding: 14px; border-radius: 22px; background: rgba(255,255,255,0.86); backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%); border: 1px solid rgba(255,255,255,0.95)">
<div style="display: flex; gap: 12px; align-items: center">
<div style="flex: none; width: 112px; aspect-ratio: 16 / 10; border-radius: 10px; border: 1px solid rgba(22,22,29,0.08); overflow: hidden"><svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="New screenshot" style="display: block; width: 100%; height: 100%"><sc-for list="{{codeImg.rects}}" as="q" hint-placeholder-count="3"><rect x="{{q.x}}" y="{{q.y}}" width="{{q.w}}" height="{{q.h}}" rx="{{q.rx}}" style="fill: {{q.f}}; opacity: {{q.o}}; stroke: {{q.s}}; stroke-width: {{q.sw}}"></rect></sc-for><sc-for list="{{codeImg.circles}}" as="q" hint-placeholder-count="3"><circle cx="{{q.x}}" cy="{{q.y}}" r="{{q.r}}" style="fill: {{q.f}}"></circle></sc-for></svg></div>
<div style="min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 600">Saved to Shots</span>
<span style="font-size: 13px; color: #4A4A58">Copied to clipboard · text found</span>
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #5A5A6B">Code — store.rs · {{sizeLabel}}</span>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<a href="ShotEditor.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 10px; background: {{accent}}; color: #FFFFFF; font-size: 13px; font-weight: 600; text-decoration: none">Edit</a>
<button type="button" style="min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(22,22,29,0.1); background: rgba(255,255,255,0.85); color: #3A3A48; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer">Copy text</button>
<button type="button" style="min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(22,22,29,0.1); background: rgba(255,255,255,0.85); color: #3A3A48; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer">Add to task</button>
<button type="button" onClick="{{again}}" style="min-height: 36px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; color: #4338CA; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer">Take another</button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4F46E5","options":["#4F46E5","#0F766E","#C2410C","#16161D"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const accent = this.props.accent ?? '#4F46E5';
    const mode = st.mode || 'area';
    const delay = st.delay ?? 0;
    const opts = st.opts || { ocr: true, edit: false };
    const phase = st.phase || 'select';
    const mock = (kind, seed) => {
      const W = 1600, H = 1000;
      const rects = [];
      const circles = [];
      const r = (x, y, w, h, f, rx, o, s) => rects.push({ x, y, w, h, f, rx: rx || 0, o: o ?? 1, s: s || 'none', sw: s ? 2 : 0 });
      const c = (x, y, rr, f) => circles.push({ x, y, r: rr, f });
      const widths = [520, 760, 430, 880, 610, 340, 700, 560, 820, 480, 650, 390, 720, 300, 590, 680, 450, 770];
      const w = (i) => widths[(i + seed * 5) % widths.length];
      const dots = (y) => { c(36, y, 9, '#FF5F57'); c(66, y, 9, '#FEBC2E'); c(96, y, 9, '#28C840'); };
      if (kind === 'code') {
        r(0, 0, W, H, '#1E1E2A'); r(0, 0, W, 64, '#2A2A38'); dots(32); r(0, 64, 260, H - 64, '#232330');
        for (let i = 0; i < 14; i++) r(36, 110 + i * 56, 120 + (i * 37) % 110, 14, '#4A4A5E', 7);
        const cols = ['#C4B5FD', '#E6E6EE', '#86EFAC', '#7DD3FC', '#FDBA74', '#9CA3AF'];
        const ind = [0, 1, 1, 2, 2, 1, 0, 1, 2, 3, 2, 1, 0, 1, 1, 0, 0];
        for (let i = 0; i < 17; i++) { r(300, 108 + i * 50, 30, 14, '#4A4A5E', 4); r(360 + ind[i] * 48, 106 + i * 50, Math.round(w(i) * 0.8), 18, cols[(i + seed) % cols.length], 9, 0.85); }
      } else if (kind === 'web') {
        r(0, 0, W, H, '#FFFFFF'); r(0, 0, W, 72, '#F3F4F6'); dots(36); r(420, 18, 760, 36, '#FFFFFF', 18); r(160, 120, 1280, 300, ['#EEF0FF', '#FFF1E8', '#EAF3F0'][seed % 3], 24); r(220, 190, 620, 44, '#16161D', 10, 0.85); r(220, 256, 460, 22, '#5A5A6B', 11, 0.5); r(220, 330, 180, 52, '#4F46E5', 14);
        for (let i = 0; i < 3; i++) { r(160 + i * 440, 470, 400, 300, '#F8F8FB', 20, 1, '#E5E7EB'); r(200 + i * 440, 510, 220, 22, '#16161D', 11, 0.7); r(200 + i * 440, 550, 300, 14, '#9CA3AF', 7); r(200 + i * 440, 576, 260, 14, '#9CA3AF', 7); }
      } else if (kind === 'terminal') {
        r(0, 0, W, H, '#0F1115'); r(0, 0, W, 56, '#1A1D24'); dots(28);
        for (let i = 0; i < 18; i++) { r(40, 96 + i * 48, 24, 16, '#86EFAC', 4); r(80, 96 + i * 48, Math.round(w(i) * 0.9), 16, i % 5 === 4 ? '#F87171' : (i % 3 === 0 ? '#86EFAC' : '#9CA3AF'), 8, 0.8); }
      } else if (kind === 'design') {
        r(0, 0, W, H, '#E9E9EE'); r(0, 0, W, 56, '#FFFFFF'); r(0, 56, 220, H - 56, '#F7F7F9');
        for (let i = 0; i < 10; i++) r(30, 90 + i * 40, 150, 14, '#C9C9D3', 7);
        for (let i = 0; i < 3; i++) {
          const x = 300 + i * 430;
          r(x, 120, 380, 780, '#FFFFFF', 18, 1, '#DADAE3'); c(x + 190, 300, 90, ['#C4B5FD', '#FDBA74', '#6EE7B7'][(i + seed) % 3]); r(x + 40, 440, 300, 26, '#16161D', 13, 0.8); r(x + 40, 490, 240, 16, '#9CA3AF', 8); r(x + 40, 520, 280, 16, '#9CA3AF', 8); r(x + 40, 820, 140, 48, '#4F46E5', 14);
        }
      } else if (kind === 'chart') {
        r(0, 0, W, H, '#FFFFFF'); r(0, 0, W, 72, '#F3F4F6'); dots(36); r(120, 110, 420, 40, '#16161D', 12, 0.85); r(120, 168, 260, 20, '#9CA3AF', 10);
        for (let i = 0; i < 3; i++) { r(120 + i * 460, 220, 420, 130, '#F8F8FB', 18, 1, '#E5E7EB'); r(150 + i * 460, 250, 140, 16, '#9CA3AF', 8); r(150 + i * 460, 285, 200, 36, '#16161D', 10, 0.8); }
        const hs = [180, 260, 220, 340, 300, 420, 380, 460, 400, 500, 470, 520];
        r(120, 900, 1360, 3, '#E5E7EB');
        for (let i = 0; i < 12; i++) r(150 + i * 110, 900 - hs[i], 70, hs[i], i % 2 ? '#A78BFA' : '#6366F1', 10);
      } else {
        r(0, 0, W, H, '#ECECF1'); r(560, 50, 480, 900, '#FFFFFF', 12); c(800, 130, 34, '#10B981'); r(680, 190, 240, 22, '#16161D', 11, 0.8); r(720, 226, 160, 14, '#9CA3AF', 7);
        for (let i = 0; i < 9; i++) { r(620, 300 + i * 52, 200 + (i * 53) % 120, 14, '#9CA3AF', 7); r(900, 300 + i * 52, 80, 14, '#6B6B7B', 7); }
        r(620, 790, 360, 2, '#E5E7EB'); r(620, 820, 140, 24, '#16161D', 12); r(860, 814, 120, 32, '#16161D', 12);
      }
      return { rects, circles };
    };
    const boxes = {
      area: { style: 'left: 20%; top: 22%; width: 34%; height: 40%', size: '653 × 432' },
      window: { style: 'left: 8%; top: 10%; width: 54%; aspect-ratio: 16 / 10', size: '1037 × 648' },
      screen: { style: 'left: 3px; top: 3px; right: 3px; bottom: 3px', size: '1920 × 1080' }
    };
    const seg = (on) => on
      ? 'background: #16161D; color: #FFFFFF'
      : 'background: transparent; color: #3A3A48';
    const delays = [0, 3, 5];
    return {
      accent,
      codeImg: mock('code', 0),
      webImg: mock('web', 1),
      selecting: phase === 'select',
      done: phase === 'done',
      boxStyle: boxes[mode].style,
      sizeLabel: boxes[mode].size,
      isArea: mode === 'area',
      isWindow: mode === 'window',
      modes: [
        { key: 'area', label: 'Area' },
        { key: 'window', label: 'Window' },
        { key: 'screen', label: 'Screen' }
      ].map((m) => ({
        ...m,
        isArea: m.key === 'area',
        isWindow: m.key === 'window',
        isScreen: m.key === 'screen',
        style: seg(mode === m.key),
        pressed: mode === m.key ? 'true' : 'false',
        pick: () => this.setState({ mode: m.key })
      })),
      delayLabel: delay ? 'Delay ' + delay + 's' : 'No delay',
      cycleDelay: () => this.setState({ delay: delays[(delays.indexOf(delay) + 1) % delays.length] }),
      options: [
        { key: 'ocr', label: 'Read text (OCR)' },
        { key: 'edit', label: 'Open editor after' }
      ].map((o) => {
        const on = !!opts[o.key];
        return {
          ...o,
          on,
          pressed: on ? 'true' : 'false',
          style: on ? 'background: rgba(79,70,229,0.10); color: #4338CA; border-color: rgba(79,70,229,0.25)' : 'background: rgba(255,255,255,0.8); color: #3A3A48; border-color: rgba(22,22,29,0.1)',
          box: on ? 'background: ' + accent : 'border: 1.5px solid rgba(22,22,29,0.3); background: #FFFFFF',
          toggle: () => this.setState({ opts: { ...opts, [o.key]: !on } })
        };
      }),
      capture: () => this.setState({ phase: 'done' }),
      again: () => this.setState({ phase: 'select' })
    };
  }
}
</script>
</body>
</html>
