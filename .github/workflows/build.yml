name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config patchelf
      - run: npm ci
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run build
      - name: Build .deb
        run: npm run tauri build -- --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: trove-deb
          path: src-tauri/target/release/bundle/deb/*.deb
